# ============================================================
# 港大医院投诉管理系统 Nginx 配置文件
# 版本: v1.0
# 更新时间: 2024-01-15
# 描述: 支持HTTP/HTTPS、PC端、H5移动端、API反向代理
# ============================================================

# ============================================================
# 上游服务器配置（后端Java应用）
# ============================================================
upstream complaint_backend {
    server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================================
# HTTP到HTTPS重定向
# ============================================================
server {
    listen 80;
    server_name complaint.hkuh.edu.cn;

    # 强制跳转HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================================
# HTTPS主服务器配置
# ============================================================
server {
    listen 443 ssl http2;
    server_name complaint.hkuh.edu.cn;

    # ----------------------------------------
    # SSL/TLS 配置
    # ----------------------------------------
    ssl_certificate     /etc/nginx/ssl/hkuh.crt;
    ssl_certificate_key /etc/nginx/ssl/hkuh.key;

    # TLS 1.3 和 1.2
    ssl_protocols TLSv1.3 TLSv1.2;

    # 安全加密套件
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA;

    ssl_prefer_server_ciphers on;

    # SSL会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ----------------------------------------
    # 安全响应头（等保三级要求）
    # ----------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.bootcdn.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' https://cdn.jsdelivr.net https://cdn.bootcdn.net; connect-src 'self' https:; frame-ancestors 'self';" always;

    # ----------------------------------------
    # 电脑端前端（PC Web）
    # ----------------------------------------
    location / {
        root /opt/complaint/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 缓存控制
        location ~* \.(html|htm)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ----------------------------------------
    # 移动端H5应用
    # ----------------------------------------
    location /h5/ {
        alias /opt/complaint/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;

        # H5特定缓存策略
        location ~* \.(html|htm)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # ----------------------------------------
    # API反向代理
    # ----------------------------------------
    location /api/ {
        proxy_pass http://complaint_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 1024m;

        # 请求体大小限制
        client_max_body_size 50m;
        client_body_buffer_size 256k;

        # 隐藏后端响应头
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ----------------------------------------
    # H5 API代理
    # ----------------------------------------
    location /h5-api/ {
        proxy_pass http://complaint_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;

        client_max_body_size 50m;
    }

    # ----------------------------------------
    # WebSocket支持
    # ----------------------------------------
    location /ws/ {
        proxy_pass http://complaint_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ----------------------------------------
    # 文件上传代理
    # ----------------------------------------
    location /upload/ {
        proxy_pass http://complaint_backend/api/upload/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 100m;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ----------------------------------------
    # 静态资源缓存（JS/CSS/图片/字体）
    # ----------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|svgz|webp|webm|woff|woff2|ttf|eot|otf)$ {
        root /opt/complaint/web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;

        # 跨域资源共享（CORS）
        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization";
        }
    }

    # H5静态资源
    location ~* ^/h5/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /opt/complaint/h5;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ----------------------------------------
    # Gzip压缩配置
    # ----------------------------------------
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/x-javascript
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;

    # ----------------------------------------
    # 访问日志配置
    # ----------------------------------------
    access_log /var/log/nginx/complaint_access.log main buffer=16k flush=5s;
    error_log /var/log/nginx/complaint_error.log warn;

    # ----------------------------------------
    # 请求频率限制
    # ----------------------------------------
    # API接口限流
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # 并发连接限制
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 100;

    # API接口应用限流
    location ~ ^/api/ {
        limit_req zone=api_limit burst=50 nodelay;
    }

    # 登录接口更严格的限流
    location ~ ^/api/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
    }

    # ----------------------------------------
    # 禁止访问的文件和目录
    # ----------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /\.git {
        deny all;
    }

    location ~* /\.svn {
        deny all;
    }

    # 禁止访问敏感配置文件
    location ~* \.(env|gitignore|htaccess|htpasswd|ini|log|sh|sql|conf|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------
    # 健康检查接口
    # ----------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ----------------------------------------
    # 性能优化
    # ----------------------------------------
    # 打开文件缓存
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ----------------------------------------
    # 默认错误页面
    # ----------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # 404错误页面
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ============================================================
# 移动端H5专属域名配置（可选）
# ============================================================
server {
    listen 443 ssl http2;
    server_name m.complaint.hkuh.edu.cn;

    ssl_certificate /etc/nginx/ssl/hkuh.crt;
    ssl_certificate_key /etc/nginx/ssl/hkuh.key;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # H5应用
    location / {
        alias /opt/complaint/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    # API代理
    location /api/ {
        proxy_pass http://complaint_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        client_max_body_size 50m;
    }

    # 静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /opt/complaint/h5;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    access_log /var/log/nginx/complaint_h5_access.log main;
    error_log /var/log/nginx/complaint_h5_error.log;
}

# ============================================================
# 配置文件结束
# ============================================================
