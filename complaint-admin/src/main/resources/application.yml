# ============================================================
# 港大医院投诉管理系统 - Spring Boot配置文件
# 版本: v1.0
# ============================================================

spring:
  application:
    name: complaint-admin
  profiles:
    active: @spring.profiles.active@
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB
      file-size-threshold: 2KB

  # ==================== Oracle数据源配置 ====================
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=${DB_HOST:localhost})(PORT=${DB_PORT:1521}))(CONNECT_DATA=(SERVICE_NAME=${DB_SERVICE_NAME:ORCL})))
    username: ${DB_USERNAME:complaint}
    password: ${DB_PASSWORD:}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1 FROM DUAL
      pool-name: ComplaintHikariCP
      auto-commit: true
      leak-detection-threshold: 60000

  # ==================== Redis配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
        shutdown-timeout: 100ms

# ==================== MyBatis Plus配置 ====================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hkuh.complaint.entity
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    jdbc-type-for-null: null
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== Jasypt加密配置 ====================
jasypt:
  encryptor:
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    key-obtention-iterations: 1000
    pool-size: 1
    provider-name: SunJCE
    string-output-type: base64

# ==================== JWT配置 ====================
jwt:
  secret: ${JWT_SECRET:hkuh_complaint_secret_key_at_least_256_bits_for_security}
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  prefix: Bearer
  token-name: JWT_TOKEN

# ==================== 微信公众号配置 ====================
wechat:
  mp:
    app-id: ${WECHAT_MP_APP_ID:}
    app-secret: ${WECHAT_MP_APP_SECRET:}
    token: ${WECHAT_MP_TOKEN:}
    aes-key: ${WECHAT_MP_AES_KEY:}
    h5-base-url: ${WECHAT_H5_BASE_URL:https://m.hkuh.hk}

# ==================== 短信服务配置 ====================
sms:
  provider: ${SMS_PROVIDER:aliyun}
  aliyun:
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    sign-name: ${SMS_SIGN_NAME:港大医院}
    template-code:
      complaint-accept: ${SMS_TEMPLATE_COMPLAINT_ACCEPT:SMS_001}
      complaint-progress: ${SMS_TEMPLATE_COMPLAINT_PROGRESS:SMS_002}
      complaint-complete: ${SMS_TEMPLATE_COMPLAINT_COMPLETE:SMS_003}
      satisfaction-invite: ${SMS_TEMPLATE_SATISFACTION_INVITE:SMS_004}
      verification-code: ${SMS_TEMPLATE_VERIFICATION_CODE:SMS_005}

# ==================== AES加密配置 ====================
aes:
  key: ${AES_KEY:}
  iv: ${AES_IV:}

# ==================== 系统配置 ====================
app:
  name: 港大医院投诉管理系统
  version: v1.0
  base-url: ${APP_BASE_URL:https://admin.hkuh.hk}
  admin-url: ${APP_ADMIN_URL:https://admin.hkuh.hk}
  h5-url: ${APP_H5_URL:https://m.hkuh.hk}

# ==================== 文件上传配置 ====================
upload:
  base-path: /data/complaint/uploads
  allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
  max-file-size: 20MB
  max-request-size: 100MB

# ==================== SLA配置 ====================
sla:
  normal-hours: 72
  urgent-hours: 24
  sms-reminder-before: 4
  email-reminder-before: 8

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.hkuh.complaint: DEBUG
    com.hkuh.complaint.mapper: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: /var/log/complaint/application.log
    max-size: 100MB
    max-history: 30

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  tomcat:
    # ==================== 线程池配置 ====================
    threads:
      min-spare: 20
      max: 200
      max-queue-capacity: 1000

    # ==================== 连接配置 ====================
    max-connections: 1000
    accept-count: 100
    connection-timeout: 30000

    # ==================== URI编码 ====================
    uri-encoding: UTF-8

    # ==================== 会话配置 ====================
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax
        name: COMPLAINT_SESSION

    # ==================== Access日志 ====================
    accesslog:
      enabled: true
      directory: /var/log/complaint
      prefix: tomcat_access
      suffix: .log
      pattern: '%h %l %u %t "%r" %s %b %D %{X-Forwarded-For}i %{User-Agent}i'
      rotate: true
      max-days: 30

    # ==================== 其他优化 ====================
    keep-alive-timeout: 60000
    max-http-form-post-size: 50MB
    max-swallow-size: -1
    compression:
      enabled: true
      min-response-size: 1024
