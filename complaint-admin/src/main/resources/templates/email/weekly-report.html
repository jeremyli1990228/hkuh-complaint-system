<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每周投诉处理报告</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Microsoft YaHei', Arial, sans-serif; background-color: #f5f5f5;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5; padding: 20px;">
        <tr>
            <td align="center">
                <table width="700" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #7b1fa2 0%, #4a148c 100%); padding: 24px; text-align: center;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;">
                                📈 每周投诉处理报告
                            </h1>
                            <p style="color: rgba(255,255,255,0.9); margin: 8px 0 0; font-size: 14px;">
                                <span th:text="${weekStart}">2024-01-08</span> 至 <span th:text="${weekEnd}">2024-01-14</span>
                            </p>
                        </td>
                    </tr>

                    <!-- Summary Cards -->
                    <tr>
                        <td style="padding: 30px;">
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td width="20%" style="padding: 8px;">
                                        <table width="100%" cellpadding="10" cellspacing="0" style="background: linear-gradient(135deg, #e1bee7 0%, #ce93d8 100%); border-radius: 8px; text-align: center;">
                                            <tr>
                                                <td>
                                                    <div style="font-size: 24px; font-weight: 700; color: #6a1b9a;" th:text="${reportData.totalComplaints}">68</div>
                                                    <div style="font-size: 11px; color: #666666; margin-top: 4px;">本周总数</div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td width="20%" style="padding: 8px;">
                                        <table width="100%" cellpadding="10" cellspacing="0" style="background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%); border-radius: 8px; text-align: center;">
                                            <tr>
                                                <td>
                                                    <div style="font-size: 24px; font-weight: 700; color: #2e7d32;" th:text="${reportData.processedComplaints}">52</div>
                                                    <div style="font-size: 11px; color: #666666; margin-top: 4px;">已处理</div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td width="20%" style="padding: 8px;">
                                        <table width="100%" cellpadding="10" cellspacing="0" style="background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%); border-radius: 8px; text-align: center;">
                                            <tr>
                                                <td>
                                                    <div style="font-size: 24px; font-weight: 700; color: #f9a825;" th:text="${reportData.processingRate}">76.5%</div>
                                                    <div style="font-size: 11px; color: #666666; margin-top: 4px;">处理率</div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td width="20%" style="padding: 8px;">
                                        <table width="100%" cellpadding="10" cellspacing="0" style="background: linear-gradient(135deg, #bbdefb 0%, #90caf9 100%); border-radius: 8px; text-align: center;">
                                            <tr>
                                                <td>
                                                    <div style="font-size: 24px; font-weight: 700; color: #1565c0;" th:text="${reportData.avgDailyComplaints}">9.7</div>
                                                    <div style="font-size: 11px; color: #666666; margin-top: 4px;">日均新增</div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td width="20%" style="padding: 8px;">
                                        <table width="100%" cellpadding="10" cellspacing="0" style="background: linear-gradient(135deg, #ffccbc 0%, #ffab91 100%); border-radius: 8px; text-align: center;">
                                            <tr>
                                                <td>
                                                    <div style="font-size: 24px; font-weight: 700; color: #d84315;" th:text="${reportData.slaComplianceRate}">89.2%</div>
                                                    <div style="font-size: 11px; color: #666666; margin-top: 4px;">SLA达标</div>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Daily Trend -->
                    <tr th:if="${reportData.dailyTrends != null and not #lists.isEmpty(reportData.dailyTrends)}">
                        <td style="padding: 0 30px 30px;">
                            <h3 style="color: #333333; font-size: 16px; margin: 0 0 12px; border-left: 4px solid #7b1fa2; padding-left: 8px;">
                                每日趋势
                            </h3>
                            <table width="100%" cellpadding="0" cellspacing="0" style="border: 1px solid #eeeeee; border-radius: 8px; overflow: hidden;">
                                <thead>
                                    <tr style="background-color: #f5f5f5;">
                                        <th style="padding: 12px; text-align: center; font-size: 12px; color: #666666;">日期</th>
                                        <th style="padding: 12px; text-align: center; font-size: 12px; color: #666666;">新增</th>
                                        <th style="padding: 12px; text-align: center; font-size: 12px; color: #666666;">已处理</th>
                                        <th style="padding: 12px; text-align: center; font-size: 12px; color: #666666;">待处理</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="trend : ${reportData.dailyTrends}" style="border-top: 1px solid #eeeeee;">
                                        <td style="padding: 10px; text-align: center; font-size: 12px; color: #333333;" th:text="${trend.date}">周一</td>
                                        <td style="padding: 10px; text-align: center; font-size: 12px; color: #1565c0;" th:text="${trend.newCount}">10</td>
                                        <td style="padding: 10px; text-align: center; font-size: 12px; color: #2e7d32;" th:text="${trend.processedCount}">8</td>
                                        <td style="padding: 10px; text-align: center; font-size: 12px; color: #f57c00;" th:text="${trend.pendingCount}">2</td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>

                    <!-- Dept Ranking -->
                    <tr th:if="${reportData.deptRankings != null and not #lists.isEmpty(reportData.deptRankings)}">
                        <td style="padding: 0 30px 30px;">
                            <h3 style="color: #333333; font-size: 16px; margin: 0 0 12px; border-left: 4px solid #7b1fa2; padding-left: 8px;">
                                科室处理排名
                            </h3>
                            <table width="100%" cellpadding="0" cellspacing="0" style="border: 1px solid #eeeeee; border-radius: 8px; overflow: hidden;">
                                <thead>
                                    <tr style="background-color: #f5f5f5;">
                                        <th style="padding: 12px; text-align: center; font-size: 12px; color: #666666;">排名</th>
                                        <th style="padding: 12px; text-align: left; font-size: 12px; color: #666666;">科室</th>
                                        <th style="padding: 12px; text-align: center; font-size: 12px; color: #666666;">处理数</th>
                                        <th style="padding: 12px; text-align: center; font-size: 12px; color: #666666;">SLA达标</th>
                                        <th style="padding: 12px; text-align: center; font-size: 12px; color: #666666;">平均时长</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="dept : ${reportData.deptRankings}" style="border-top: 1px solid #eeeeee;">
                                        <td style="padding: 10px; text-align: center;">
                                            <span th:if="${dept.rank == 1}" style="background: #ffd700; color: #fff; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: 600;">🥇</span>
                                            <span th:if="${dept.rank == 2}" style="background: #c0c0c0; color: #fff; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: 600;">🥈</span>
                                            <span th:if="${dept.rank == 3}" style="background: #cd7f32; color: #fff; padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: 600;">🥉</span>
                                            <span th:if="${dept.rank > 3}" style="color: #666666; font-size: 12px;" th:text="${dept.rank}">4</span>
                                        </td>
                                        <td style="padding: 10px; text-align: left; font-size: 12px; color: #333333;" th:text="${dept.deptName}">内科</td>
                                        <td style="padding: 10px; text-align: center; font-size: 12px; color: #666666;" th:text="${dept.processedCount}">15</td>
                                        <td style="padding: 10px; text-align: center; font-size: 12px; color: #2e7d32;" th:text="${dept.slaRate}">98%</td>
                                        <td style="padding: 10px; text-align: center; font-size: 12px; color: #666666;" th:text="${dept.avgHours}">3.2h</td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>

                    <!-- Type Distribution -->
                    <tr th:if="${reportData.typeDistributions != null and not #lists.isEmpty(reportData.typeDistributions)}">
                        <td style="padding: 0 30px 30px;">
                            <h3 style="color: #333333; font-size: 16px; margin: 0 0 12px; border-left: 4px solid #7b1fa2; padding-left: 8px;">
                                投诉类型分布
                            </h3>
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr th:each="type : ${reportData.typeDistributions}" style="margin-bottom: 8px;">
                                    <td style="padding: 8px 0;">
                                        <div style="display: flex; align-items: center;">
                                            <span style="width: 100px; font-size: 12px; color: #333333;" th:text="${type.typeName}">服务态度</span>
                                            <div style="flex: 1; height: 8px; background: #e0e0e0; border-radius: 4px; margin: 0 10px;">
                                                <div th:style="'height: 100%; width: ' + ${type.percentage} + '%; background: linear-gradient(90deg, #7b1fa2, #9c27b0); border-radius: 4px;'" style="height: 100%; background: linear-gradient(90deg, #7b1fa2, #9c27b0); border-radius: 4px;"></div>
                                            </div>
                                            <span style="width: 60px; text-align: right; font-size: 12px; color: #666666;" th:text="${type.count} + '件'">25件</span>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Button -->
                    <tr>
                        <td style="padding: 0 30px 30px; text-align: center;">
                            <a th:href="${detailUrl}" style="display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #7b1fa2 0%, #4a148c 100%); color: #ffffff; text-decoration: none; border-radius: 25px; font-size: 14px; font-weight: 600;">
                                查看完整报告 →
                            </a>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #fafafa; padding: 20px; text-align: center; border-top: 1px solid #eeeeee;">
                            <p style="color: #999999; font-size: 12px; margin: 0;">
                                本报告由港大医院投诉管理系统自动生成<br>
                                如有疑问，请联系系统管理员
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
