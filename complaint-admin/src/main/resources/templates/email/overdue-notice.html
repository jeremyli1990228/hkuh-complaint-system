<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超期通知</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Microsoft YaHei', Arial, sans-serif; background-color: #f5f5f5;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5; padding: 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%); padding: 24px; text-align: center;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 600;">
                                🚨 超期通知
                            </h1>
                            <p style="color: rgba(255,255,255,0.9); margin: 8px 0 0; font-size: 14px;">
                                投诉工单已超过SLA处理时限
                            </p>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 30px;">
                            <p style="color: #666666; font-size: 14px; line-height: 1.8; margin: 0 0 20px;">
                                您好，您负责的投诉工单已经超过 SLA 处理时限，请立即处理：
                            </p>

                            <table width="100%" cellpadding="12" cellspacing="0" style="background-color: #ffebee; border-radius: 8px; margin-bottom: 20px;">
                                <tr>
                                    <td style="border-bottom: 1px solid #ffcdd2; padding: 12px;">
                                        <span style="color: #666666; font-size: 14px;">工单编号</span>
                                    </td>
                                    <td style="border-bottom: 1px solid #ffcdd2; padding: 12px;">
                                        <strong style="color: #c62828; font-size: 16px;" th:text="${feedbackNo}">FB20240001</strong>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="border-bottom: 1px solid #ffcdd2; padding: 12px;">
                                        <span style="color: #666666; font-size: 14px;">投诉标题</span>
                                    </td>
                                    <td style="border-bottom: 1px solid #ffcdd2; padding: 12px;">
                                        <span style="color: #333333; font-size: 14px;" th:text="${title}">关于门诊等候时间过长的投诉</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="border-bottom: 1px solid #ffcdd2; padding: 12px;">
                                        <span style="color: #666666; font-size: 14px;">当前处理人</span>
                                    </td>
                                    <td style="border-bottom: 1px solid #ffcdd2; padding: 12px;">
                                        <span style="color: #333333; font-size: 14px;" th:text="${handlerName}">张三</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding: 12px;">
                                        <span style="color: #666666; font-size: 14px;">超期天数</span>
                                    </td>
                                    <td style="padding: 12px;">
                                        <strong style="color: #d32f2f; font-size: 20px;" th:text="${overdueDays}">3</strong>
                                        <span style="color: #666666; font-size: 14px;">天</span>
                                    </td>
                                </tr>
                            </table>

                            <p style="color: #d32f2f; font-size: 14px; text-align: center; margin: 0 0 20px; padding: 12px; background: #ffcdd2; border-radius: 4px;">
                                ⚠️ 此工单已超时处理，将影响科室绩效评分
                            </p>

                            <!-- Button -->
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center">
                                        <a th:href="${detailUrl}" style="display: inline-block; padding: 14px 40px; background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%); color: #ffffff; text-decoration: none; border-radius: 25px; font-size: 16px; font-weight: 600;">
                                            立即处理 →
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #fafafa; padding: 20px; text-align: center; border-top: 1px solid #eeeeee;">
                            <p style="color: #999999; font-size: 12px; margin: 0;">
                                本邮件由港大医院投诉管理系统自动发送<br>
                                请尽快处理超期工单
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
